# Put these locations inside the existing jinrou.icu server block.
# Replace the old static /thememaker/ location; keep the game location unchanged.
location = /thememaker { return 301 /thememaker/; }
location ^~ /thememaker/ {
    proxy_pass http://127.0.0.1:4318;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /thememaker-api/ {
    proxy_pass http://127.0.0.1:4318;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;
    proxy_read_timeout 120s;
}
